[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hecavex-radar"
version = "0.1.0"
description = "Production collectors and publisher for the HECAVEX-operated radar.hecavex.com service."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "confusable-homoglyphs==3.3.1",
  "idna==3.19",
  "jsonschema==4.26.0",
  "tldextract==5.3.2",
  "tzdata==2026.3",
  "websockets==17.1",
]

[project.optional-dependencies]
dev = [
  "hypothesis==6.167.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.5",
  # The 3.3.1 wheel omits the bundled schemas required by validate_file().
  "stix2-validator==3.2.0",
]

[project.scripts]
hecavex-sync = "hecavex_radar.sync:run"
hecavex-certstream = "hecavex_radar.collect_certstream:run"
hecavex-ct-search = "hecavex_radar.ct_search:main"
hecavex-domain-context = "hecavex_radar.domain_context:main"
hecavex-urlscan = "hecavex_radar.urlscan:run"
hecavex-brand-assets = "hecavex_radar.brand_assets:run"
hecavex-review = "hecavex_radar.review:run"
hecavex-review-queue = "hecavex_radar.review_queue:main"
hecavex-coverage-ledger = "hecavex_radar.coverage_ledger:main"
hecavex-quality-artifacts = "hecavex_radar.quality_artifacts:main"
hecavex-handoff = "hecavex_radar.hecavex:run"

[tool.setuptools.packages.find]
include = ["hecavex_radar*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
