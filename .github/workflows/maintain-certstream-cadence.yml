name: Maintain CertStream cadence

on:
  repository_dispatch:
    types: [certstream_writer_completed]
  workflow_dispatch:
  workflow_run:
    workflows: [Collect CertStream candidates]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: radar-certstream-cadence
  cancel-in-progress: true

jobs:
  relay:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion != 'success') ||
      (github.event.client_payload.source_workflow == 'Collect CertStream candidates' &&
      github.event.client_payload.source_ref == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: radar-certstream-cadence
    steps:
      # Cadence policy is reviewed main code; generated radar-data is not executable.
      - name: Check out trusted cadence policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Dispatch one due collection
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          runs="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/actions/workflows/collect-certstream.yml/runs?per_page=20")"

          # Only old, superseded queued runs with a fresh zero-job response can
          # be reconciled. The collector's serialized persisted due guard remains authoritative.
          decision="$(python -m hecavex_radar.certstream_cadence --repository "${REPOSITORY}" <<<"${runs}")"
          if [[ "${decision}" == "active-owner" ]]; then
            echo "A CertStream collection is already queued or running; no relay dispatch is needed."
            exit 0
          fi
          if [[ "${decision}" != "dispatch" ]]; then
            echo "Invalid cadence decision; refusing dispatch." >&2
            exit 1
          fi

          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/actions/workflows/collect-certstream.yml/dispatches" \
            -f ref=main \
            -f 'inputs[cadence_relay]=true'
          echo "Dispatched the next bounded CertStream collection."
