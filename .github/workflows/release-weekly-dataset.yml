name: Release weekly radar dataset

on:
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:
    inputs:
      release_week:
        description: "Optional ISO week to backfill (YYYY-Www); must match the selected snapshot"
        required: false
        type: string
      source_sha:
        description: "Legacy backfill: full main-branch snapshot commit; cannot be combined with data_sha"
        required: false
        type: string
      data_sha:
        description: "Optional full radar-data publication commit; otherwise select latest coherent publication"
        required: false
        type: string
      correction_revision:
        description: "Optional immutable correction revision (1-999)"
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: weekly-radar-dataset-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select publication blobs without executing the data branch
        id: data
        env:
          LEGACY_SOURCE_SHA: ${{ inputs.source_sha || '' }}
          REQUESTED_DATA_SHA: ${{ inputs.data_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${LEGACY_SOURCE_SHA}" && -n "${REQUESTED_DATA_SHA}" ]]; then
            echo "::error::Choose either legacy source_sha or data_sha, never both."
            exit 1
          fi
          if [[ -z "${LEGACY_SOURCE_SHA}" ]]; then
            args=()
            if [[ -n "${REQUESTED_DATA_SHA}" ]]; then
              args+=(--revision "${REQUESTED_DATA_SHA}")
            fi
            python -m hecavex_radar.data_branch materialize --repository . --branch radar-data \
              --view publication --state-file "${RUNNER_TEMP}/radar-release-data.json" \
              --github-output "${GITHUB_OUTPUT}" "${args[@]}"
          fi

      - name: Select the ISO-week release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_WEEK: ${{ inputs.release_week || '' }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha || '' }}
          REQUESTED_DATA_SHA: ${{ inputs.data_sha || '' }}
          SELECTED_DATA_SHA: ${{ steps.data.outputs.data_revision || '' }}
          CORRECTION_REVISION: ${{ inputs.correction_revision || '' }}
        shell: bash
        run: |
          set -euo pipefail
          trusted_sha="$(git rev-parse HEAD)"
          if [[ "${trusted_sha}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Trusted tooling checkout does not match the triggering main commit."
            exit 1
          fi
          source_sha="${REQUESTED_SOURCE_SHA:-${SELECTED_DATA_SHA}}"
          if [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Selected data must identify one full commit."
            exit 1
          fi
          if [[ -n "${REQUESTED_DATA_SHA}" && "${source_sha}" != "${REQUESTED_DATA_SHA}" ]]; then
            echo "::error::data_sha must itself be a coherent publication commit, not an intermediate writer commit."
            exit 1
          fi
          if [[ -n "${REQUESTED_SOURCE_SHA}" ]]; then
            if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::source_sha must be one full lowercase 40-character commit SHA."
              exit 1
            fi
            compare_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${source_sha}...main" --jq '.status')"
            if [[ "${compare_status}" != "ahead" && "${compare_status}" != "identical" ]]; then
              echo "::error::source_sha must be an ancestor of the current main branch."
              exit 1
            fi
            if ! git cat-file -e "${source_sha}^{commit}" 2>/dev/null || \
              ! git merge-base --is-ancestor "${source_sha}" "${trusted_sha}"; then
              echo "::error::source_sha is not available as an ancestor of the trusted tooling commit."
              exit 1
            fi
          fi
          manifest_entry="$(git ls-tree "${source_sha}" -- public/data/feed-manifest.json)"
          IFS=$' \t' read -r manifest_mode manifest_type manifest_object manifest_path <<< "${manifest_entry}"
          if [[ "${manifest_mode}" != "100644" || "${manifest_type}" != "blob" || \
            "${manifest_path}" != "public/data/feed-manifest.json" ]]; then
            echo "::error::The selected feed manifest is not one regular data blob."
            exit 1
          fi
          manifest_bytes="$(git cat-file -s "${manifest_object}")"
          if [[ ! "${manifest_bytes}" =~ ^[0-9]+$ ]] || (( manifest_bytes < 2 || manifest_bytes > 262144 )); then
            echo "::error::The selected feed manifest is empty or exceeds 256 KiB."
            exit 1
          fi
          snapshot_week="$(
            git cat-file blob "${manifest_object}" |
              python -c 'import json,sys; from datetime import datetime; value=json.load(sys.stdin)["generatedAt"]; parsed=datetime.fromisoformat(value.removesuffix("Z") + "+00:00"); year,week,_=parsed.isocalendar(); print(f"{year:04d}-W{week:02d}")'
          )"
          release_week="${REQUESTED_RELEASE_WEEK:-${snapshot_week}}"
          if [[ ! "${release_week}" =~ ^[0-9]{4}-W(0[1-9]|[1-4][0-9]|5[0-3])$ ]]; then
            echo "::error::release_week must use canonical YYYY-Www syntax."
            exit 1
          fi
          if [[ "${release_week}" != "${snapshot_week}" ]]; then
            echo "::error::release_week ${release_week} does not match snapshot week ${snapshot_week} at ${source_sha}."
            exit 1
          fi
          base_tag="radar-data-${release_week}"
          tag="${base_tag}"
          release_label="${release_week}"
          if [[ -n "${CORRECTION_REVISION}" ]]; then
            if [[ ! "${CORRECTION_REVISION}" =~ ^[1-9][0-9]{0,2}$ ]]; then
              echo "::error::correction_revision must be an integer from 1 to 999."
              exit 1
            fi
            tag="${base_tag}-r${CORRECTION_REVISION}"
            release_label="${release_week}-r${CORRECTION_REVISION}"
            base_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${base_tag}" 2>/dev/null || true)"
            if [[ -z "${base_release}" ]] || [[ "$(jq -r '.draft' <<<"${base_release}")" != "false" ]] || \
              [[ "$(jq -r '.immutable' <<<"${base_release}")" != "true" ]]; then
              echo "::error::A published immutable ${base_tag} release is required before a correction."
              exit 1
            fi
          fi
          existing=""
          existing_lookup_ok=false
          for api_attempt in 1 2 3 4; do
            if existing="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
              jq -s -r --arg tag "${tag}" '
                map(.[]) | map(select(.tag_name == $tag)) | first |
                if . == null then "" else
                  [
                    .id,
                    (.draft | tostring),
                    .target_commitish,
                    (.immutable | tostring),
                    (.assets | map(.name) | sort | join(","))
                  ] | @tsv
                end
              ')"; then
              existing_lookup_ok=true
              break
            fi
            sleep "${api_attempt}"
          done
          if [[ "${existing_lookup_ok}" != "true" ]]; then
            echo "::error::Could not determine whether ${tag} already exists after bounded retries."
            exit 1
          fi

          should_release=true
          resume_draft=false
          if [[ -n "${existing}" ]]; then
            IFS=$'\t' read -r release_id is_draft target_commitish immutable existing_assets <<< "${existing}"
            if [[ "${is_draft}" == "false" ]]; then
              if [[ "${immutable}" != "true" ]]; then
                echo "::error::${tag} exists but is not immutable. Do not publish another weekly release until repository release immutability is enabled."
                exit 1
              fi
              expected_assets="$(printf '%s\n' \
                SHA256SUMS \
                "${tag}.manifest.json" \
                "${tag}.spdx.json" \
                "${tag}.tar.gz" | sort | paste -sd, -)"
              if [[ "${existing_assets}" != "${expected_assets}" ]]; then
                echo "::error::Immutable ${tag} has an unexpected asset inventory: ${existing_assets:-none}."
                exit 1
              fi
              if [[ ! "${target_commitish}" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::Immutable ${tag} does not target one auditable commit SHA."
                exit 1
              fi
              # Existing releases may target legacy main data or the dedicated
              # data branch. Neither target is ever checked out or executed.
              git fetch --no-tags origin main radar-data
              if ! git merge-base --is-ancestor "${target_commitish}" origin/main &&
                ! git merge-base --is-ancestor "${target_commitish}" origin/radar-data; then
                echo "::error::Immutable ${tag} does not target an approved source/data history."
                exit 1
              fi
              target_week="$(
                gh api "repos/${GITHUB_REPOSITORY}/contents/public/data/feed-manifest.json?ref=${target_commitish}" --jq '.content' |
                  tr -d '\n' |
                  base64 --decode |
                  python -c 'import json,sys; from datetime import datetime; value=json.load(sys.stdin)["generatedAt"]; parsed=datetime.fromisoformat(value.removesuffix("Z") + "+00:00"); year,week,_=parsed.isocalendar(); print(f"{year:04d}-W{week:02d}")'
              )"
              if [[ "${target_week}" != "${release_week}" ]]; then
                echo "::error::Immutable ${tag} targets snapshot week ${target_week}, not ${release_week}."
                exit 1
              fi
              if [[ ( -n "${REQUESTED_SOURCE_SHA}" || -n "${REQUESTED_DATA_SHA}" ) && "${target_commitish}" != "${source_sha}" ]]; then
                echo "::error::Immutable ${tag} targets ${target_commitish}, not requested source ${source_sha}."
                exit 1
              fi
              echo "${tag} is already published and immutable; this run is a no-op."
              should_release=false
            else
              if [[ "${target_commitish}" != "${source_sha}" ]]; then
                echo "::error::Draft ${tag} targets ${target_commitish}, not ${source_sha}. Review the interrupted draft manually."
                exit 1
              fi
              resume_draft=true
            fi
          fi

          {
            echo "week=${release_label}"
            echo "base_tag=${base_tag}"
            echo "tag=${tag}"
            echo "correction_revision=${CORRECTION_REVISION}"
            echo "source_sha=${source_sha}"
            echo "trusted_sha=${trusted_sha}"
            echo "should_release=${should_release}"
            echo "resume_draft=${resume_draft}"
          } >> "${GITHUB_OUTPUT}"

      - name: Require the immutable-release operator gate
        if: steps.release.outputs.should_release == 'true'
        env:
          IMMUTABILITY_CONFIRMED: ${{ vars.RADAR_IMMUTABLE_RELEASES_CONFIRMED }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${IMMUTABILITY_CONFIRMED}" != "true" ]]; then
            echo "::error::Enable release immutability in the repository Releases settings, then set RADAR_IMMUTABLE_RELEASES_CONFIRMED=true."
            exit 1
          fi

      - name: Set up Python
        if: steps.release.outputs.should_release == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/automation-ci-py312.lock

      - name: Install the validated publication toolchain
        if: steps.release.outputs.should_release == 'true'
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/automation-ci-py312.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .

      - name: Materialize the selected data-only release source
        if: steps.release.outputs.should_release == 'true'
        id: source
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          release_source_root="$(mktemp -d "${RUNNER_TEMP}/radar-release-source.XXXXXXXX")"
          rmdir "${release_source_root}"
          python -m hecavex_radar.release_source \
            --repository "${GITHUB_WORKSPACE}" \
            --source-sha "${SOURCE_SHA}" \
            --output "${release_source_root}"
          echo "root=${release_source_root}" >> "${GITHUB_OUTPUT}"

      - name: Validate selected publication data with current tooling
        if: steps.release.outputs.should_release == 'true'
        env:
          RELEASE_SOURCE_ROOT: ${{ steps.source.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          from hecavex_radar.publication import validate_publication

          # Import only the installed trusted toolchain before changing the
          # data-relative validation boundary. The extracted root has no code.
          os.chdir(os.environ["RELEASE_SOURCE_ROOT"])
          validate_publication(Path(os.environ["RELEASE_SOURCE_ROOT"]), validate_stix=True)
          PY

      - name: Build a reproducible dataset package
        if: steps.release.outputs.should_release == 'true'
        id: package
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          TRUSTED_TOOLING_SHA: ${{ steps.release.outputs.trusted_sha }}
          RELEASE_SOURCE_ROOT: ${{ steps.source.outputs.root }}
          URLSCAN_DERIVED_REDISTRIBUTION_CONFIRMED: ${{ vars.URLSCAN_DERIVED_REDISTRIBUTION_CONFIRMED || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path, PurePosixPath

          repository = Path.cwd().resolve()
          source_repository = Path(os.environ["RELEASE_SOURCE_ROOT"]).resolve(strict=True)
          public_root = source_repository / "public"
          data_root = public_root / "data"
          output_root = repository / "_release"
          tag = os.environ["RELEASE_TAG"]
          package_root = output_root / "stage" / tag
          assets_root = output_root / "assets"
          maximum_files = 10_000
          maximum_bytes = 128 * 1024 * 1024

          if output_root.parent.resolve() != repository or output_root.name != "_release":
              raise SystemExit("Refusing an unexpected release output path")
          if (
              source_repository.is_symlink()
              or public_root.is_symlink()
              or data_root.is_symlink()
              or not public_root.resolve(strict=True).is_relative_to(source_repository)
          ):
              raise SystemExit("Refusing a symlinked public dataset root")
          if output_root.exists():
              shutil.rmtree(output_root)
          package_root.mkdir(parents=True)
          assets_root.mkdir(parents=True)

          feed_manifest_path = data_root / "feed-manifest.json"
          feed_manifest = json.loads(feed_manifest_path.read_text(encoding="utf-8"))
          snapshot = json.loads((data_root / "radar.json").read_text(encoding="utf-8"))
          index = json.loads((data_root / "radar.index.json").read_text(encoding="utf-8"))
          selected: dict[str, tuple[Path, bytes]] = {}
          selection_totals = {"bytes": 0}

          def select_public_file(raw_path: object, *, expected_bytes: object = None,
                                 expected_sha256: object = None) -> None:
              if not isinstance(raw_path, str) or not raw_path.startswith("/data/"):
                  raise SystemExit(f"Refusing unsafe public artifact path: {raw_path!r}")
              relative = PurePosixPath(raw_path.removeprefix("/"))
              if (
                  relative.is_absolute()
                  or ".." in relative.parts
                  or raw_path != f"/{relative.as_posix()}"
                  or relative.as_posix() == "data/collection-health.json"
              ):
                  raise SystemExit(f"Refusing excluded or unsafe public artifact path: {raw_path}")
              relative_text = relative.as_posix()
              if relative_text in selected:
                  raise SystemExit(f"Duplicate selected public artifact path: {raw_path}")

              source = public_root.joinpath(*relative.parts)
              cursor = public_root
              for part in relative.parts:
                  cursor /= part
                  if cursor.is_symlink():
                      raise SystemExit(f"Refusing symlink in public dataset: {relative_text}")
              try:
                  resolved = source.resolve(strict=True)
              except OSError as error:
                  raise SystemExit(f"Missing selected public artifact: {relative_text}") from error
              if not resolved.is_relative_to(public_root.resolve()) or not source.is_file():
                  raise SystemExit(f"Refusing non-file public artifact: {relative_text}")

              payload = source.read_bytes()
              digest = hashlib.sha256(payload).hexdigest()
              if expected_bytes is not None and (not isinstance(expected_bytes, int) or len(payload) != expected_bytes):
                  raise SystemExit(f"Selected artifact byte length drifted: {relative_text}")
              if expected_sha256 is not None and (not isinstance(expected_sha256, str) or digest != expected_sha256):
                  raise SystemExit(f"Selected artifact digest drifted: {relative_text}")
              next_total_bytes = selection_totals["bytes"] + len(payload)
              if len(selected) + 1 > maximum_files or next_total_bytes > maximum_bytes:
                  raise SystemExit(
                      f"Weekly dataset exceeds release caps while selecting {relative_text}: "
                      f"files={len(selected) + 1}/{maximum_files}, "
                      f"bytes={next_total_bytes}/{maximum_bytes}"
                  )
              selected[relative_text] = (source, payload)
              selection_totals["bytes"] = next_total_bytes

          artifacts = feed_manifest.get("artifacts")
          if not isinstance(artifacts, list) or not artifacts:
              raise SystemExit("Feed manifest has no canonical artifact list")
          for artifact in artifacts:
              if not isinstance(artifact, dict):
                  raise SystemExit("Feed manifest contains a non-object artifact row")
              artifact_path = artifact.get("path")
              select_public_file(
                  artifact_path,
                  expected_bytes=artifact.get("bytes"),
                  expected_sha256=artifact.get("sha256"),
              )
              checksum_path = f"{artifact_path}.sha256"
              select_public_file(checksum_path)
              checksum_payload = selected[checksum_path.removeprefix("/")][1]
              expected_checksum = f"{artifact['sha256']}  {PurePosixPath(str(artifact_path)).name}\n".encode("ascii")
              if checksum_payload != expected_checksum:
                  raise SystemExit(f"Artifact checksum sidecar drifted: {checksum_path}")

          select_public_file("/data/feed-manifest.json")
          select_public_file("/data/feed-manifest.json.sha256")
          feed_digest = hashlib.sha256(feed_manifest_path.read_bytes()).hexdigest()
          expected_feed_checksum = f"{feed_digest}  feed-manifest.json\n".encode("ascii")
          if selected["data/feed-manifest.json.sha256"][1] != expected_feed_checksum:
              raise SystemExit("Feed-manifest checksum sidecar drifted")

          shards = index.get("shards")
          if not isinstance(shards, list):
              raise SystemExit("Radar index has no shard list")
          for shard in shards:
              if not isinstance(shard, dict):
                  raise SystemExit("Radar index contains a non-object shard row")
              select_public_file(
                  shard.get("path"),
                  expected_bytes=shard.get("bytes"),
                  expected_sha256=shard.get("sha256"),
              )

          signals = snapshot.get("signals")
          if not isinstance(signals, list):
              raise SystemExit("Radar snapshot has no signal list")
          for signal in signals:
              if not isinstance(signal, dict):
                  raise SystemExit("Radar snapshot contains a non-object signal row")
              if signal.get("detailAvailable") is not True:
                  continue
              signal_id = signal.get("id")
              if not isinstance(signal_id, str) or len(signal_id) != 20 or any(character not in "0123456789abcdef" for character in signal_id):
                  raise SystemExit(f"Refusing invalid detail signal ID: {signal_id!r}")
              select_public_file(f"/data/signals/{signal_id[:2]}/{signal_id}.json")

          actual: set[str] = set()
          for candidate in data_root.rglob("*"):
              if candidate.is_symlink():
                  raise SystemExit(f"Refusing symlink in public dataset: {candidate.relative_to(public_root).as_posix()}")
              if candidate.is_file():
                  relative_text = candidate.relative_to(public_root).as_posix()
                  if relative_text != "data/collection-health.json":
                      actual.add(relative_text)
          expected = set(selected)
          if actual != expected:
              missing = sorted(expected - actual)
              unexpected = sorted(actual - expected)
              raise SystemExit(
                  "Public dataset inventory is not canonical; "
                  f"missing={','.join(missing)}; unexpected={','.join(unexpected)}"
              )

          included = []
          for relative_text, (_, payload) in sorted(selected.items()):
              destination = package_root.joinpath(*PurePosixPath(relative_text).parts)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(payload)
              included.append(
                  {
                      "path": relative_text,
                      "bytes": len(payload),
                      "sha256": hashlib.sha256(payload).hexdigest(),
                  }
              )

          release_version = tag.removeprefix("radar-data-")
          release_week = release_version.split("-r", 1)[0]
          release_manifest = {
              "schemaVersion": 1,
              "dataset": "hecavex-radar-weekly-release",
              "releaseWeek": release_week,
              "tag": tag,
              "sourceRepository": os.environ["GITHUB_REPOSITORY"],
              "sourceCommit": os.environ["SOURCE_SHA"],
              "toolingCommit": os.environ["TRUSTED_TOOLING_SHA"],
              "snapshotGeneratedAt": feed_manifest["generatedAt"],
              "archiveRoot": tag,
              "license": "https://github.com/Hecavex/radar.hecavex.com/blob/main/DATA-LICENSE.md",
              "sourceFeedManifest": {
                  "path": "data/feed-manifest.json",
                  "sha256": feed_digest,
              },
              "excluded": [
                  {
                      "path": "data/collection-health.json",
                      "reason": "This latest-attempt health document changes independently of the atomic snapshot.",
                  }
              ],
              "limits": {
                  "maximumFiles": maximum_files,
                  "maximumBytes": maximum_bytes,
              },
              "files": included,
          }
          manifest_payload = (
              json.dumps(release_manifest, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          ).encode("utf-8")
          (package_root / "RELEASE-MANIFEST.json").write_bytes(manifest_payload)
          (assets_root / f"{tag}.manifest.json").write_bytes(manifest_payload)
          PY

          python -m hecavex_radar.release_context_history \
            --tag "${RELEASE_TAG}" \
            --source-repository "${RELEASE_SOURCE_ROOT}"

          archive_name="${RELEASE_TAG}.tar.gz"
          manifest_name="${RELEASE_TAG}.manifest.json"
          tar --sort=name --format=gnu --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -C _release/stage -cf - "${RELEASE_TAG}" |
            gzip -n -9 > "_release/assets/${archive_name}"
          tar --sort=name --format=gnu --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -C _release/stage -cf - "${RELEASE_TAG}" |
            gzip -n -9 > "_release/reproducibility-check.tar.gz"
          cmp --silent "_release/assets/${archive_name}" "_release/reproducibility-check.tar.gz"
          gzip --test "_release/assets/${archive_name}"
          tar -tzf "_release/assets/${archive_name}" |
            awk '/(^\/|(^|\/)\.\.($|\/))/ { bad=1 } END { exit bad }'
          sbom_name="${RELEASE_TAG}.spdx.json"
          python -m hecavex_radar.sbom \
            --tag "${RELEASE_TAG}" \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${TRUSTED_TOOLING_SHA}" \
            --release-manifest "_release/assets/${manifest_name}" \
            --file "_release/assets/${archive_name}" \
            --file "_release/assets/${manifest_name}" \
            --output "_release/assets/${sbom_name}"
          (
            cd _release/assets
            sha256sum "${archive_name}" "${manifest_name}" "${sbom_name}" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          {
            echo "archive_path=_release/assets/${archive_name}"
            echo "manifest_path=_release/assets/${manifest_name}"
            echo "sbom_path=_release/assets/${sbom_name}"
            echo "checksums_path=_release/assets/SHA256SUMS"
          } >> "${GITHUB_OUTPUT}"

      - name: Write release notes
        if: steps.release.outputs.should_release == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          BASE_RELEASE_TAG: ${{ steps.release.outputs.base_tag }}
          CORRECTION_REVISION: ${{ steps.release.outputs.correction_revision }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          TRUSTED_TOOLING_SHA: ${{ steps.release.outputs.trusted_sha }}
        shell: bash
        run: |
          cat > _release/notes.md <<EOF
          Weekly static export of the public HECAVEX Radar dataset at commit \`${SOURCE_SHA}\`.

          The archive contains the manifest-declared publication artifacts and checksums, index-declared shards, snapshot-declared signal sidecars, and up to 90 validated date partitions of the passive context-change journal as one point-in-time package. URLScan-derived journal rows remain excluded unless redistribution is explicitly confirmed. The independently replaced \`collection-health.json\` latest-attempt document is excluded. \`${RELEASE_TAG}.manifest.json\` records every packaged dataset and context file and digest plus the selected data commit and trusted tooling commit \`${TRUSTED_TOOLING_SHA}\`; the identical in-archive manifest cannot recursively inventory itself. \`${RELEASE_TAG}.spdx.json\` is an SPDX 2.3 inventory generated from that trusted tooling commit's pinned Python and pnpm repository inputs. \`SHA256SUMS\` covers the archive, standalone manifest, and SBOM.

          Radar publishes sampled research leads, not maliciousness verdicts or comprehensive monitoring. Review the [methodology](https://radar.hecavex.com/methodology/) and [data terms](https://github.com/Hecavex/radar.hecavex.com/blob/main/DATA-LICENSE.md) before use.

          Verify downloads with \`sha256sum --check SHA256SUMS\`. Verify workflow provenance with \`gh attestation verify ${RELEASE_TAG}.tar.gz --repo ${GITHUB_REPOSITORY}\`; the manifest, SBOM, and checksum list are attested as separate subjects by the same workflow.
          EOF
          if [[ -n "${CORRECTION_REVISION}" ]]; then
            cat >> _release/notes.md <<EOF

          This immutable correction release supersedes \`${BASE_RELEASE_TAG}\` for data use. The original release remains available as an unmodified audit record.
          EOF
          fi

      - name: Create or refresh the draft release
        if: steps.release.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_WEEK: ${{ steps.release.outputs.week }}
          RESUME_DRAFT: ${{ steps.release.outputs.resume_draft }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RESUME_DRAFT}" == "true" ]]; then
            gh release upload "${RELEASE_TAG}" _release/assets/* --clobber
            gh release edit "${RELEASE_TAG}" \
              --target "${SOURCE_SHA}" \
              --title "HECAVEX Radar dataset ${RELEASE_WEEK}" \
              --notes-file _release/notes.md \
              --draft
          else
            gh release create "${RELEASE_TAG}" _release/assets/* \
              --target "${SOURCE_SHA}" \
              --title "HECAVEX Radar dataset ${RELEASE_WEEK}" \
              --notes-file _release/notes.md \
              --latest=false \
              --draft
          fi

          release_id=""
          for lookup_attempt in 1 2 3 4 5; do
            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | .id" | head -n 1)"
            [[ -n "${release_id}" ]] && break
            sleep "${lookup_attempt}"
          done
          test -n "${release_id}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --jq '.assets[].name' | sort > _release/actual-assets.txt
          printf '%s\n' SHA256SUMS "${RELEASE_TAG}.manifest.json" "${RELEASE_TAG}.spdx.json" "${RELEASE_TAG}.tar.gz" |
            sort > _release/expected-assets.txt
          diff --unified _release/expected-assets.txt _release/actual-assets.txt

      - name: Attest every release asset
        if: steps.release.outputs.should_release == 'true'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.package.outputs.archive_path }}
            ${{ steps.package.outputs.manifest_path }}
            ${{ steps.package.outputs.sbom_path }}
            ${{ steps.package.outputs.checksums_path }}

      - name: Publish and verify the immutable release
        if: steps.release.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "${RELEASE_TAG}" --draft=false --latest=false
          immutable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.immutable')"
          if [[ "${immutable}" != "true" ]]; then
            echo "::error::GitHub published ${RELEASE_TAG} without immutable-release protection. Review repository Releases settings before any later release."
            exit 1
          fi
