name: Refresh temporal passive context

on:
  schedule:
    - cron: "31 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-archive-writer
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/automation-runtime-py312.lock

      - name: Materialize trusted operational data
        id: data
        run: >-
          python -m hecavex_radar.data_branch materialize --repository .
          --state-file "${{ runner.temp }}/radar-data-base.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Install validated runtime
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/automation-runtime-py312.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .

      - name: Refresh bounded context and change journal
        id: refresh
        continue-on-error: true
        env:
          PASSIVE_CONTEXT_STATE: data/enrichment/passive-context.json
          PASSIVE_CONTEXT_JOURNAL: data/history/context
          PASSIVE_CONTEXT_PER_RUN: ${{ vars.PASSIVE_CONTEXT_PER_RUN || '20' }}
          PASSIVE_CONTEXT_CACHE_HOURS: ${{ vars.PASSIVE_CONTEXT_CACHE_HOURS || '24' }}
          PASSIVE_CONTEXT_URLSCAN_DAYS: ${{ vars.PASSIVE_CONTEXT_URLSCAN_DAYS || '14' }}
          PASSIVE_CONTEXT_JOURNAL_DAYS: ${{ vars.PASSIVE_CONTEXT_JOURNAL_DAYS || '60' }}
          PASSIVE_CONTEXT_RPKI_ENABLED: ${{ vars.PASSIVE_CONTEXT_RPKI_ENABLED || 'false' }}
          URLSCAN_DERIVED_REDISTRIBUTION_CONFIRMED: ${{ vars.URLSCAN_DERIVED_REDISTRIBUTION_CONFIRMED || 'false' }}
          PASSIVE_CONTEXT_RUN_BUDGET_SECONDS: ${{ vars.PASSIVE_CONTEXT_RUN_BUDGET_SECONDS || '480' }}
        run: python -m hecavex_radar.passive_context

      - name: Commit bounded state and journal
        id: commit
        if: steps.refresh.outcome == 'success' && steps.data.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh auth setup-git
          python -m hecavex_radar.data_branch publish --repository . \
            --state-file "${{ runner.temp }}/radar-data-base.json" \
            --writer passive-context --message "data: publish passive-context state" \
            --github-output "$GITHUB_OUTPUT"
      - name: Propagate collection or publication failure
        if: always() && (steps.refresh.outcome != 'success' || steps.commit.outcome != 'success')
        run: |
          echo "Passive-context refresh or state publication failed."
          exit 1
