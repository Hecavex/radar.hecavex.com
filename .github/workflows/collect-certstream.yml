name: Collect CertStream candidates

on:
  schedule:
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:
    inputs:
      cadence_relay:
        description: "Internal cadence relay dispatch"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: radar-certstream-writer
  cancel-in-progress: false
  queue: max

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CERTSTREAM_DURATION_SECONDS: "480"
      CERTSTREAM_EXPECTED_INTERVAL_SECONDS: "900"
      CERTSTREAM_STALE_AFTER_SECONDS: "2700"
      CERTSTREAM_DELAY_THRESHOLD_SECONDS: "300"
      CERTSTREAM_DUE_TOLERANCE_SECONDS: "300"
      CERTSTREAM_SCHEDULE_MINUTES: "8,23,38,53"
      CERTSTREAM_TRIGGER: ${{ inputs.cadence_relay && 'cadence-relay' || github.event_name }}
      CERTSTREAM_HEALTH_PATH: public/data/collection-health.json
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/automation-runtime-py312.lock
      - name: Materialize trusted operational data
        id: data
        run: >-
          python -m hecavex_radar.data_branch materialize --repository .
          --state-file "${{ runner.temp }}/radar-data-base.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Initialize public collection health when due
        id: cadence
        run: python -m hecavex_radar.collection_health begin-if-due
      - name: Install Python dependencies
        id: dependencies
        if: steps.cadence.outputs.due == 'true'
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/automation-runtime-py312.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
      - name: Prepare CertStream source
        id: source
        if: always() && steps.cadence.outputs.due == 'true' && steps.dependencies.outcome == 'success'
        continue-on-error: true
        env:
          CERTSTREAM_SOURCE_URL: ${{ secrets.CERTSTREAM_URL || vars.CERTSTREAM_URL }}
        shell: bash
        run: |
          if [[ -n "${CERTSTREAM_SOURCE_URL}" ]]; then
            echo "CERTSTREAM_URL=${CERTSTREAM_SOURCE_URL}" >> "${GITHUB_ENV}"
            echo "CERTSTREAM_ALLOW_INSECURE_WS=false" >> "${GITHUB_ENV}"
            exit 0
          fi
          docker run --detach --name certstream-source \
            --publish 127.0.0.1:8080:8080 \
            --env CERTSTREAM_STREAM_FULL_ENABLED=false \
            --env CERTSTREAM_STREAM_LITE_ENABLED=true \
            --env CERTSTREAM_STREAM_DOMAINS_ONLY_ENABLED=false \
            ghcr.io/reloading01/certstream-server-rust:1.5.3@sha256:e7422e0b41aa89358ed4f07a0c78a5e80208c3ae0bff1c367bd0929ba2fa0e0b
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then
              echo "CERTSTREAM_URL=ws://127.0.0.1:8080/" >> "${GITHUB_ENV}"
              echo "CERTSTREAM_ALLOW_INSECURE_WS=true" >> "${GITHUB_ENV}"
              exit 0
            fi
            sleep 2
          done
          echo "Local CertStream source did not become healthy." >&2
          exit 1
      - name: Collect a bounded CertStream window
        id: collector
        if: always() && steps.cadence.outputs.due == 'true' && steps.source.outcome == 'success'
        continue-on-error: true
        env:
          CERTSTREAM_FLUSH_SECONDS: "15"
          CERTSTREAM_IDLE_SECONDS: "90"
          CERTSTREAM_REQUIRE_MESSAGES: "true"
          CERTSTREAM_MIN_CONFIDENCE: ${{ vars.CERTSTREAM_MIN_CONFIDENCE }}
          CERTSTREAM_ARCHIVE_ROOT: data/certstream
        run: python -m hecavex_radar.collect_certstream
      - name: Stop local CertStream source
        if: always() && steps.cadence.outputs.due == 'true'
        shell: bash
        run: docker rm --force certstream-source 2> /dev/null || true
      - name: Finalize public collection health
        id: health
        if: always() && steps.cadence.outputs.due == 'true'
        env:
          CERTSTREAM_INSTALL_OUTCOME: ${{ steps.dependencies.outcome }}
          CERTSTREAM_PREPARE_OUTCOME: ${{ steps.source.outcome }}
          CERTSTREAM_COLLECTOR_OUTCOME: ${{ steps.collector.outcome }}
        run: python -m hecavex_radar.collection_health finalize
      - name: Commit the attempt atomically
        id: commit
        if: always() && steps.cadence.outputs.due == 'true' && steps.health.outcome == 'success' && steps.data.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh auth setup-git
          python -m hecavex_radar.data_branch publish --repository . \
            --state-file "${{ runner.temp }}/radar-data-base.json" \
            --writer certstream --message "data: publish certstream state" \
            --github-output "$GITHUB_OUTPUT"
      - name: Fail an unsuccessful collection attempt
        if: always() && steps.cadence.outputs.due == 'true'
        env:
          INSTALL_OUTCOME: ${{ steps.dependencies.outcome }}
          PREPARE_OUTCOME: ${{ steps.source.outcome }}
          COLLECTOR_OUTCOME: ${{ steps.collector.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        shell: bash
        run: |
          if [[ "${INSTALL_OUTCOME}" != "success" || \
            "${PREPARE_OUTCOME}" != "success" || \
            "${COLLECTOR_OUTCOME}" != "success" || \
            "${HEALTH_OUTCOME}" != "success" ]]; then
            echo "The attempt was recorded, but collection did not complete successfully." >&2
            exit 1
          fi
      - name: Notify bounded writer completion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_CONCLUSION: ${{ job.status }}
          SOURCE_SHA: ${{ steps.data.outputs.source_revision }}
          DATA_SHA: ${{ steps.commit.outputs.data_revision || (steps.cadence.outputs.due == 'false' && steps.data.outputs.data_revision) || '' }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          collection_outcome="$(jq -r '.latestAttempt.outcome // "failed"' public/data/collection-health.json 2>/dev/null || echo failed)"
          case "${collection_outcome}" in
            healthy-empty|healthy-matches|no-input|partial|failed) ;;
            *) echo "Unexpected collection outcome: ${collection_outcome}" >&2; exit 1 ;;
          esac
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/dispatches" \
            -f event_type=certstream_writer_completed \
            -f 'client_payload[source_workflow]=Collect CertStream candidates' \
            -f "client_payload[source_conclusion]=${SOURCE_CONCLUSION}" \
            -f "client_payload[source_run_id]=${SOURCE_RUN_ID}" \
            -f "client_payload[source_ref]=${SOURCE_REF}" \
            -f "client_payload[collection_outcome]=${collection_outcome}" \
            -f "client_payload[head_sha]=${SOURCE_SHA}" \
            -f "client_payload[source_revision]=${SOURCE_SHA}" \
            -f "client_payload[data_revision]=${DATA_SHA}"
