name: Hunt URLScan observations

on:
  schedule:
    - cron: "37 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-archive-writer
  cancel-in-progress: false
  queue: max

jobs:
  hunt:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/automation-runtime-py312.lock
      - name: Materialize trusted operational data
        id: data
        run: >-
          python -m hecavex_radar.data_branch materialize --repository .
          --state-file "${{ runner.temp }}/radar-data-base.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/automation-runtime-py312.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
      - name: Hunt existing public URLScan results
        id: hunt
        continue-on-error: true
        env:
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          URLSCAN_ARCHIVE_ROOT: data/urlscan
          URLSCAN_LOOKBACK_DAYS: ${{ vars.URLSCAN_LOOKBACK_DAYS || '7' }}
          URLSCAN_MIN_CONFIDENCE: ${{ vars.URLSCAN_MIN_CONFIDENCE || '80' }}
          URLSCAN_SEARCH_LIMIT: ${{ vars.URLSCAN_SEARCH_LIMIT || '100' }}
          URLSCAN_DETAIL_LIMIT: ${{ vars.URLSCAN_DETAIL_LIMIT || '30' }}
          URLSCAN_TITLE_DETAIL_LIMIT: ${{ vars.URLSCAN_TITLE_DETAIL_LIMIT || '10' }}
          URLSCAN_HASH_PIVOT_LIMIT: ${{ vars.URLSCAN_HASH_PIVOT_LIMIT || '3' }}
          URLSCAN_HASH_RESULT_LIMIT: ${{ vars.URLSCAN_HASH_RESULT_LIMIT || '10' }}
          URLSCAN_HASH_DETAIL_LIMIT: ${{ vars.URLSCAN_HASH_DETAIL_LIMIT || '30' }}
          URLSCAN_CT_SEEDS_ENABLED: ${{ vars.URLSCAN_CT_SEEDS_ENABLED || 'true' }}
          URLSCAN_CT_ARCHIVE_ROOT: data/certstream
          URLSCAN_CT_LOOKBACK_DAYS: ${{ vars.URLSCAN_CT_LOOKBACK_DAYS || '7' }}
          URLSCAN_CT_SEED_LIMIT: ${{ vars.URLSCAN_CT_SEED_LIMIT || '100' }}
          URLSCAN_CT_SEED_MIN_CONFIDENCE: ${{ vars.URLSCAN_CT_SEED_MIN_CONFIDENCE || '80' }}
          URLSCAN_RADAR_SEEDS_ENABLED: ${{ vars.URLSCAN_RADAR_SEEDS_ENABLED || 'true' }}
          URLSCAN_RADAR_SNAPSHOT: ${{ vars.URLSCAN_RADAR_SNAPSHOT || 'public/data/radar.json' }}
          URLSCAN_RADAR_SEED_LIMIT: ${{ vars.URLSCAN_RADAR_SEED_LIMIT || '250' }}
          URLSCAN_INTELLIGENCE_SEEDS_ENABLED: ${{ vars.URLSCAN_INTELLIGENCE_SEEDS_ENABLED || 'true' }}
          PHISHDESTROY_SEED_ENABLED: ${{ vars.PHISHDESTROY_SEED_ENABLED || 'true' }}
          CERTPL_SEED_ENABLED: ${{ vars.CERTPL_SEED_ENABLED || 'true' }}
          URLSCAN_EXACT_SEED_LIMIT: ${{ vars.URLSCAN_EXACT_SEED_LIMIT || '250' }}
          URLSCAN_SEED_BATCH_SIZE: ${{ vars.URLSCAN_SEED_BATCH_SIZE || '20' }}
          URLSCAN_SEED_SEARCH_LIMIT: ${{ vars.URLSCAN_SEED_SEARCH_LIMIT || '50' }}
          URLSCAN_SEED_DETAIL_LIMIT: ${{ vars.URLSCAN_SEED_DETAIL_LIMIT || '30' }}
          URLSCAN_SEED_ROTATION_SHARDS: ${{ vars.URLSCAN_SEED_ROTATION_SHARDS || '1' }}
          URLSCAN_SEEDS_PER_RUN: ${{ vars.URLSCAN_SEEDS_PER_RUN || '250' }}
          URLSCAN_DAILY_SEARCH_CAP: ${{ vars.URLSCAN_DAILY_SEARCH_CAP || '900' }}
          URLSCAN_DAILY_RESULT_CAP: ${{ vars.URLSCAN_DAILY_RESULT_CAP || '8000' }}
          URLSCAN_RUN_SEARCH_CAP: ${{ vars.URLSCAN_RUN_SEARCH_CAP || '25' }}
          URLSCAN_RUN_RESULT_CAP: ${{ vars.URLSCAN_RUN_RESULT_CAP || '100' }}
          INTELLIGENCE_SEED_MIN_CONFIDENCE: ${{ vars.INTELLIGENCE_SEED_MIN_CONFIDENCE || '80' }}
          INTELLIGENCE_SEED_LIMIT: ${{ vars.INTELLIGENCE_SEED_LIMIT || '250' }}
          URLSCAN_MAX_SIGNALS: ${{ vars.URLSCAN_MAX_SIGNALS || '500' }}
        run: python -m hecavex_radar.urlscan
      - name: Commit validated public archive updates
        id: commit
        if: always() && steps.data.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh auth setup-git
          python -m hecavex_radar.data_branch publish --repository . \
            --state-file "${{ runner.temp }}/radar-data-base.json" \
            --writer urlscan --message "data: publish urlscan state" \
            --github-output "$GITHUB_OUTPUT"
      - name: Propagate hunt or publication failure
        if: always() && (steps.hunt.outcome != 'success' || steps.commit.outcome != 'success')
        shell: bash
        run: |
          echo "URLScan hunt or state publication failed."
          exit 1
