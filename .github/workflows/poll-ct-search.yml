name: Poll checkpointed CT search

on:
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-certstream-writer
  cancel-in-progress: false
  queue: max

jobs:
  poll:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/automation-runtime-py312.lock
      - name: Materialize trusted operational data
        id: data
        run: >-
          python -m hecavex_radar.data_branch materialize --repository .
          --state-file "${{ runner.temp }}/radar-data-base.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/automation-runtime-py312.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
      - name: Poll replayable CT keyword searches
        id: poll
        continue-on-error: true
        env:
          CT_SEARCH_STATE_PATH: data/ct-search/state.json
          CT_SEARCH_QUERIES_PER_RUN: ${{ vars.CT_SEARCH_QUERIES_PER_RUN || '6' }}
          CT_SEARCH_ROWS_PER_QUERY: ${{ vars.CT_SEARCH_ROWS_PER_QUERY || '500' }}
          CT_SEARCH_BOOTSTRAP_DAYS: ${{ vars.CT_SEARCH_BOOTSTRAP_DAYS || '7' }}
          CT_SEARCH_REPLAY_IDS: ${{ vars.CT_SEARCH_REPLAY_IDS || '1000' }}
          CT_SEARCH_REPLAY_ROWS: ${{ vars.CT_SEARCH_REPLAY_ROWS || '50' }}
          CERTSTREAM_ARCHIVE_ROOT: data/certstream
        run: python -m hecavex_radar.ct_search
      - name: Commit checkpoint and candidates atomically
        id: commit
        if: always() && steps.data.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh auth setup-git
          python -m hecavex_radar.data_branch publish --repository . \
            --state-file "${{ runner.temp }}/radar-data-base.json" \
            --writer ct-search --message "data: publish ct-search state" \
            --github-output "$GITHUB_OUTPUT"
      - name: Propagate polling or publication failure
        if: always() && (steps.poll.outcome != 'success' || steps.commit.outcome != 'success')
        shell: bash
        run: |
          echo "CT polling or checkpoint publication failed."
          exit 1
