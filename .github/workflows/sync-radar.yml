name: Sync radar snapshot

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      allow_small_snapshot:
        description: "Allow this run to bypass the snapshot-size guard"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: radar-archive-writer
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/automation-runtime-py312.lock
      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/automation-runtime-py312.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
      - name: Build the persistent public snapshot
        env:
          CERTSTREAM_ARCHIVE_ENABLED: "true"
          CERTSTREAM_ARCHIVE_ROOT: data/certstream
          RADAR_CT_LOOKBACK_DAYS: ${{ vars.RADAR_CT_LOOKBACK_DAYS || '7' }}
          URLSCAN_ARCHIVE_ENABLED: "true"
          URLSCAN_ARCHIVE_ROOT: data/urlscan
          RADAR_URLSCAN_LOOKBACK_DAYS: ${{ vars.RADAR_URLSCAN_LOOKBACK_DAYS || '30' }}
          HECAVEX_ENABLED: ${{ vars.HECAVEX_ENABLED || 'false' }}
          HECAVEX_FEED_URL: ${{ secrets.HECAVEX_FEED_URL }}
          HECAVEX_FEED_TOKEN: ${{ secrets.HECAVEX_FEED_TOKEN }}
          RADAR_MAX_SIGNALS: ${{ vars.RADAR_MAX_SIGNALS || '2500' }}
          RADAR_MIN_SIGNALS: ${{ vars.RADAR_MIN_SIGNALS || '0' }}
          RADAR_MIN_RETAINED_PERCENT: ${{ vars.RADAR_MIN_RETAINED_PERCENT || '25' }}
          RADAR_SNAPSHOT_GUARD_DAYS: ${{ vars.RADAR_SNAPSHOT_GUARD_DAYS || '30' }}
          RADAR_RETAIN_EXISTING_SIGNALS: ${{ vars.RADAR_RETAIN_EXISTING_SIGNALS || 'true' }}
          RADAR_RETAIN_DAYS: ${{ vars.RADAR_RETAIN_DAYS || '7' }}
          RADAR_STIX_OUTPUT: public/data/radar.stix.json
          RADAR_REVIEWED_STIX_OUTPUT: public/data/radar-reviewed.stix.json
          RADAR_DETAIL_ROOT: public/data/signals
          RADAR_HISTORY_DETAIL_DAYS: ${{ vars.RADAR_HISTORY_DETAIL_DAYS || '30' }}
          RADAR_HISTORY_SUMMARY_DAYS: ${{ vars.RADAR_HISTORY_SUMMARY_DAYS || '730' }}
          RADAR_HISTORY_MAX_SIGNALS: ${{ vars.RADAR_HISTORY_MAX_SIGNALS || '5000' }}
          PASSIVE_CONTEXT_JOURNAL: data/history/context
          PASSIVE_CONTEXT_JOURNAL_DAYS: ${{ vars.PASSIVE_CONTEXT_JOURNAL_DAYS || '60' }}
          URLSCAN_DERIVED_REDISTRIBUTION_CONFIRMED: ${{ vars.URLSCAN_DERIVED_REDISTRIBUTION_CONFIRMED || 'false' }}
          RADAR_MISP_FEED_ENABLED: ${{ vars.RADAR_MISP_FEED_ENABLED || 'false' }}
          RADAR_ALLOW_SMALL_SNAPSHOT: ${{ inputs.allow_small_snapshot || 'false' }}
        run: python -m hecavex_radar.sync
      - name: Validate the atomic publication
        run: python -m hecavex_radar.publication
      - name: Refresh deterministic quality artifacts
        run: |
          python -m hecavex_radar.quality_artifacts
          python -m hecavex_radar.quality_artifacts --check
      - name: Commit a changed snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git add -- \
            public/data/radar.json \
            public/data/radar.stix.json \
            public/data/radar-reviewed.stix.json \
            public/data/radar.index.json \
            public/data/radar-shards \
            public/data/changes.json \
            public/data/events.json \
            public/data/events.atom.xml \
            public/data/events.rss.xml \
            public/data/events.feed.json \
            public/data/brand-feeds.json \
            public/data/brands \
            public/data/daily-trends.json \
            public/data/quality-metrics.json \
            public/data/pipeline-health.json \
            public/data/related-observations.json \
            public/data/misp \
            public/data/misp-warninglists \
            public/data/feed-manifest.json \
            public/data/schemas \
            public/data/*.sha256 \
            public/data/history.json \
            public/data/signals \
            data/history \
            data/coverage/brand-coverage.json \
            data/review/review-queue.json
          if [[ -d public/data/history-parts ]]; then
            git add -A -- public/data/history-parts
          fi
          if git diff --cached --quiet; then
            echo "Snapshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh public radar snapshot"
          gh auth setup-git
          base_sha="$(git rev-parse HEAD^)"
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin main
            upstream_sha="$(git rev-parse origin/main)"
            if [[ "${upstream_sha}" != "${base_sha}" ]]; then
              invalidating_paths="$(git diff --name-only "${base_sha}..${upstream_sha}" | grep -E \
                '^(data/(certstream|ct-search|enrichment|urlscan|review)/)' || true)"
              if [[ -n "${invalidating_paths}" ]]; then
                echo "Source inputs changed while this snapshot was being built; refusing stale output:" >&2
                echo "${invalidating_paths}" >&2
                exit 1
              fi
              unexpected_paths="$(git diff --name-only "${base_sha}..${upstream_sha}" | grep -Ev \
                '^(public/data/collection-health\.json)$' || true)"
              if [[ -n "${unexpected_paths}" ]]; then
                echo "Code or configuration changed after checkout; refusing older-revision output:" >&2
                echo "${unexpected_paths}" >&2
                exit 1
              fi
              git rebase origin/main
              base_sha="${upstream_sha}"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ "${attempt}" -eq 4 ]]; then
              echo "Snapshot publication lost four push races." >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
      - name: Notify bounded writer completion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_CONCLUSION: ${{ job.status }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/dispatches" \
            -f event_type=snapshot_writer_completed \
            -f 'client_payload[source_workflow]=Sync radar snapshot' \
            -f "client_payload[source_conclusion]=${SOURCE_CONCLUSION}" \
            -f "client_payload[source_run_id]=${SOURCE_RUN_ID}" \
            -f "client_payload[source_ref]=${SOURCE_REF}" \
            -f "client_payload[head_sha]=${SOURCE_SHA}"
