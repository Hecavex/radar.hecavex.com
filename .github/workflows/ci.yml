name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/certstream/**"
      - "data/ct-search/**"
      - "data/enrichment/**"
      - "data/urlscan/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/automation-ci-py312.lock
      - name: Install Python dependencies
        run: |
          python scripts/python-locks.py
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/automation-ci-py312.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify project
        run: pnpm check
      - name: Report durable-store headroom
        run: python -m hecavex_radar.capacity
      - name: Build the supported retained-history growth fixture
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: pnpm verify:growth
