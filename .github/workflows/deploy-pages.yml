name: Deploy radar

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  repository_dispatch:
    types: [certstream_writer_completed, snapshot_writer_completed]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false
  # A later, ineligible completion must not evict a valid pending deployment.
  queue: max

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push') ||
      (github.event_name == 'repository_dispatch' &&
      github.event.client_payload.source_ref == 'main' &&
      ((github.event.client_payload.source_workflow == 'Sync radar snapshot' &&
      github.event.client_payload.source_conclusion == 'success') ||
      (github.event.client_payload.source_workflow == 'Collect CertStream candidates' &&
      github.event.client_payload.source_conclusion == 'failure')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      should_deploy: ${{ steps.freshness.outputs.should_deploy }}
      revision: ${{ steps.freshness.outputs.revision }}
      data_revision: ${{ steps.data.outputs.data_revision }}
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Materialize allowlisted operational data with trusted source tooling
        id: data
        run: |
          python -m hecavex_radar.data_branch materialize --repository . --branch radar-data \
            --view operational --state-file "${RUNNER_TEMP}/radar-data-base.json" \
            --github-output "${GITHUB_OUTPUT}"
      - name: Reject stale source or unproven writer completions
        id: freshness
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.client_payload.head_sha }}
          TRIGGER_DATA_SHA: ${{ github.event.client_payload.data_revision || '' }}
          SOURCE_SHA: ${{ steps.data.outputs.source_revision }}
          DATA_SHA: ${{ steps.data.outputs.data_revision }}
          PUBLICATION_SOURCE_SHA: ${{ steps.data.outputs.publication_source_revision }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "${GITHUB_EVENT_NAME}" == "repository_dispatch" ]]; then
            args+=(--trigger-data "${TRIGGER_DATA_SHA}")
          fi
          python -m hecavex_radar.publication_selection \
            --source "${SOURCE_SHA}" --data "${DATA_SHA}" \
            --publication-source "${PUBLICATION_SOURCE_SHA}" --expected-source "${EXPECTED_SHA}" "${args[@]}"
          echo "revision=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "should_deploy=true" >> "${GITHUB_OUTPUT}"
      - name: Set up Node.js
        if: steps.freshness.outputs.should_deploy == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Enable pnpm
        if: steps.freshness.outputs.should_deploy == 'true'
        run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - name: Install dependencies
        if: steps.freshness.outputs.should_deploy == 'true'
        run: pnpm install --frozen-lockfile
      - name: Verify and build static site
        if: steps.freshness.outputs.should_deploy == 'true'
        env:
          RADAR_SOURCE_REVISION: ${{ steps.data.outputs.source_revision }}
          RADAR_DATA_REVISION: ${{ steps.data.outputs.data_revision }}
          HECAVEX_ANALYTICS_TOKEN: ${{ vars.HECAVEX_ANALYTICS_TOKEN }}
        run: pnpm check:frontend
      - name: Verify public deployment metadata
        if: steps.freshness.outputs.should_deploy == 'true'
        env:
          HECAVEX_ANALYTICS_TOKEN: ${{ vars.HECAVEX_ANALYTICS_TOKEN }}
        shell: bash
        run: |
          test -f dist/security.txt
          test -n "${HECAVEX_ANALYTICS_TOKEN}"
          test -f dist/.well-known/security.txt
          test -f dist/llms.txt
          test -f dist/404.html
          grep -Fq 'This route has no signal.' dist/404.html
          grep -Fq '<meta name="robots" content="noindex, follow"' dist/404.html
          ! grep -Fq '<link rel="canonical"' dist/404.html
          test -f dist/data/radar.stix.json
          test -f dist/data/radar-reviewed.stix.json
          test -f dist/data/radar.index.json
          test -f dist/data/radar-shards/0001.json
          test -f dist/data/feed-manifest.json
          test -f dist/data/feed-manifest.json.sha256
          test -f dist/data/pipeline-health.json
          test -f dist/data/changes.json
          test -f dist/data/related-observations.json
          test -f dist/data/events.json
          test -f dist/data/events.atom.xml
          test -f dist/data/events.rss.xml
          test -f dist/data/events.feed.json
          test -f dist/data/brand-feeds.json
          test -f dist/data/daily-trends.json
          test -f dist/data/quality-metrics.json
          test -f dist/data/schemas/radar-v2.schema.json
          cmp --silent dist/security.txt dist/.well-known/security.txt
          grep -Fqx "Canonical: https://radar.hecavex.com/.well-known/security.txt" dist/.well-known/security.txt
          grep -Fq '<link rel="canonical" href="https://radar.hecavex.com/"' dist/index.html
          grep -Fq 'Sampled discovery, not continuous monitoring' dist/index.html
          grep -Fq '"@type":"Dataset"' dist/index.html
          test -f dist/history/index.html
          grep -Fq '<link rel="canonical" href="https://radar.hecavex.com/history/"' dist/history/index.html
          grep -Fq 'Candidate history' dist/history/index.html
          test -f dist/brands/index.html
          grep -Fq '<link rel="canonical" href="https://radar.hecavex.com/brands/"' dist/brands/index.html
          grep -Fq 'Reviewed Lithuanian brand registry' dist/brands/index.html
          test -f dist/methodology/index.html
          grep -Fq '<link rel="canonical" href="https://radar.hecavex.com/methodology/"' dist/methodology/index.html
          grep -Fq 'How a signal reaches Radar' dist/methodology/index.html
          test -f dist/docs/index.html
          grep -Fq '<link rel="canonical" href="https://radar.hecavex.com/docs/"' dist/docs/index.html
          grep -Fq 'HECAVEX Radar technical reference' dist/docs/index.html
          for route in changes trends associations tools dataset; do
            test -f "dist/${route}/index.html"
          done
          for route in '' pokyciai prekes-zenklai metodologija; do
            test -f "dist/lt/${route:+${route}/}index.html"
          done
          for page in \
            dist/index.html \
            dist/history/index.html \
            dist/brands/index.html \
            dist/changes/index.html \
            dist/trends/index.html \
            dist/associations/index.html \
            dist/tools/index.html \
            dist/dataset/index.html \
            dist/methodology/index.html \
            dist/docs/index.html \
            dist/404.html \
            dist/lt/index.html \
            dist/lt/pokyciai/index.html \
            dist/lt/prekes-zenklai/index.html \
            dist/lt/metodologija/index.html; do
            loader_count="$(grep -Fo 'data-hecavex-analytics-token=' "${page}" | wc -l)"
            token_count="$(grep -Fo "${HECAVEX_ANALYTICS_TOKEN}" "${page}" | wc -l)"
            test "${loader_count}" -eq 1
            test "${token_count}" -eq 1
            grep -Fq 'https://static.cloudflareinsights.com/beacon.min.js' "${page}"
            grep -Fq 'navigator.doNotTrack' "${page}"
            grep -Fq 'window.doNotTrack' "${page}"
          done
          grep -Fq 'Allow: /data/radar.json' dist/robots.txt
          ! grep -Fq 'Allow: /data/radar.stix.json' dist/robots.txt
          grep -Fq 'Allow: /data/history.json' dist/robots.txt
          grep -Fqx 'Content-Signal: search=yes, ai-input=yes, ai-train=no' dist/robots.txt
          grep -Fq 'must not be made clickable or visited automatically' dist/llms.txt
          grep -Fq 'https://radar.hecavex.com/history/' dist/sitemap.xml
          grep -Fq 'https://radar.hecavex.com/brands/' dist/sitemap.xml
          grep -Fq 'https://radar.hecavex.com/changes/' dist/sitemap.xml
          grep -Fq 'https://radar.hecavex.com/trends/' dist/sitemap.xml
          grep -Fq 'https://radar.hecavex.com/associations/' dist/sitemap.xml
          grep -Fq 'https://radar.hecavex.com/tools/' dist/sitemap.xml
          grep -Fq 'https://radar.hecavex.com/dataset/' dist/sitemap.xml
          grep -Fq 'https://radar.hecavex.com/methodology/' dist/sitemap.xml
          grep -Fq 'https://radar.hecavex.com/docs/' dist/sitemap.xml
          grep -Fq 'https://radar.hecavex.com/lt/' dist/sitemap.xml
      - name: Configure GitHub Pages
        if: steps.freshness.outputs.should_deploy == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload site artifact
        if: steps.freshness.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    if: needs.build.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Check out the exact deployed verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.revision }}
          persist-credentials: false
      - name: Materialize the exact selected data, not its executable tree
        env:
          DATA_SHA: ${{ needs.build.outputs.data_revision }}
        run: |
          python -m hecavex_radar.data_branch materialize --repository . --branch radar-data \
            --view operational --revision "${DATA_SHA}" --state-file "${RUNNER_TEMP}/radar-deploy-data.json"
      - name: Refuse source or data superseded while building
        env:
          SOURCE_SHA: ${{ needs.build.outputs.revision }}
          DATA_SHA: ${{ needs.build.outputs.data_revision }}
        run: |
          python -m hecavex_radar.publication_selection --source "${SOURCE_SHA}" --data "${DATA_SHA}" \
            --publication-source "${SOURCE_SHA}" --expected-source "${SOURCE_SHA}"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Verify live release identity and bilingual data freshness
        env:
          EXPECTED_REVISION: ${{ needs.build.outputs.revision }}
          EXPECTED_DATA_REVISION: ${{ needs.build.outputs.data_revision }}
        run: |
          python -m hecavex_radar.live_smoke --expected-revision "${EXPECTED_REVISION}" \
            --expected-data-revision "${EXPECTED_DATA_REVISION}"
